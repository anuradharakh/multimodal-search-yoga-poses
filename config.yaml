project:
  name: multimodal-search-yoga-poses
  random_seed: 42
  device: auto            # auto | mps | cuda | cpu

source:
  kaggle_dataset: arrowe/yoga-poses-dataset-107
  raw_dir: null           # null → download with kagglehub; or a folder containing train/ val/ test/

paths:
  processed_dir: data/processed       # cleaned images + manifest.csv
  embeddings_dir: data/embeddings     # cached CNN features (.npy)
  index_dir: data/indexes             # Qdrant storage + fitted projection
  style_dir: data/style_transfer      # full-resolution stylised images
  styles_dir: assets/styles           # artworks used as style images
  output_dir: outputs                 # metrics, figures, screenshots (committed)

pipeline:
  run_data_prep: true
  run_embedding: true
  run_tuning: true
  run_indexing: true
  run_retrieval_eval: true
  run_style_transfer: false

data:
  min_side: 64            # drop images smaller than this (px)
  max_side: 512           # downscale so the longest side is at most this (px)
  split:                  # stratified by pose
    gallery: 0.70         # indexed in the vector database
    val: 0.15             # tuning queries
    test: 0.15            # final, held-out queries

embedding:
  backbones:              # frozen, pre-trained; all four CNNs + one non-CNN reference
    - resnet50            # torchvision, ImageNet-1k
    - efficientnet_v2_s   # torchvision, ImageNet-1k
    - convnext_tiny       # torchvision, ImageNet-1k
    - clip_rn50           # OpenAI CLIP ResNet-50 (image + text)
    - clip_vit_b32        # OpenAI CLIP ViT-B/32 — reference only, not a CNN
  preprocess: [pad, crop]
  input_size: 224
  batch_size: 64
  num_workers: 4
  overwrite: false        # true → re-extract even if cached

tuning:
  tta: [false, true]
  post_processing: [l2, pcaw256, lda0.1, lda0.3]
  selection_metric: mAP@10

evaluation:
  ks: [1, 5, 10]

indexing:
  collection: yoga_poses  # Qdrant collection (embedded / local mode under data/indexes/qdrant)

retrieval:
  top_k: 12               # results shown in the app

reranker:
  enabled: true
  neighbor_table_k: 50    # gallery neighbours stored per image at indexing time
  default: {fetch_k: 50, k: 10, weight: 0.3}   # used until the retrieval_eval stage selects params
  search_space:           # tuned on the validation split
    fetch_k: [20, 50, 100]
    k: [5, 10, 20, 30, 50]
    weight: [0.1, 0.2, 0.3, 0.5, 0.7]
  selection:              # maximise `metric` without letting the guardrail metric fall more than allowed
    metric: mAP@10
    guardrail_metric: Hit@5
    max_guardrail_drop: 0.02
  rrf_k: 60               # for the hybrid-fusion comparison

ui:
  title: Yoga Pose Search
  page_icon: "🧘"
